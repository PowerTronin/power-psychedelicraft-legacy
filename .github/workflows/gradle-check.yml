name: Build on Pull Request
on:
  - pull_request
  - workflow_dispatch
jobs:
  gradle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Build Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run Checks
        run: ./gradlew check
